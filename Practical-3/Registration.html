
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | My Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <nav class="navbar">
        <h2>MyWebsite</h2>
        <ul class="nav-links">
            <li><a href="Home.html">Home</a></li>
            <li><a href="About.html">About</a></li>
            <li><a href="Registration.html">Register</a></li>
            <li><a href="Dashboard.html">Dashboard</a></li>
            <li><a href="Events.html">Events</a></li>
        </ul>
    </nav>
</header>

<main class="container">
    <form class="form-container" action="#" method="post">
        <h1>Registration Form</h1>
        <p>Fill in your details to register.</p>

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" autofocus required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   minlength="8" placeholder="Minimum 8 characters"
                   required>
        </div>

        <div class="form-group">
            <label for="course">Course</label>
            <select id="course" name="course" required>
                <option value="">Select a course</option>
                <option value="ce">Computer Engineering</option>
                <option value="it">Information Technology</option>
                <option value="aiml">AI and Machine Learning</option>
            </select>
        </div>

        <div class="form-group">
            <label for="message">About You</label>
            <textarea id="message" name="message" rows="3"
                      placeholder="Write a short introduction"></textarea>
        </div>

        <button type="submit" class="btn">Register</button>
    </form>
</main>

<footer><p>&copy; 2026 MyWebsite</p></footer>
</body>
</html>
