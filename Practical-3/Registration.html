<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
        }

        .container{
            width:350px;
            margin:50px auto;
            background:#fff;
            padding:20px;
            border-radius:8px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            background:lightblue;
            padding:10px;
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input,
        select{
            width:100%;
            padding:8px;
            box-sizing:border-box;
        }

        .gender{
            display:flex;
            gap:20px;
        }

        .btn{
            width:100%;
            padding:10px;
            background:#007BFF;
            color:white;
            border:none;
            cursor:pointer;
            font-size:16px;
        }

        .btn:hover{
            background:#0056b3;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Registration Form</h2>

    <form >

        <div class="form-group">
            <label>Username</label>
            <input type="text" name="n1" id="n1" placeholder="Enter Username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="txtpsd" placeholder="Enter Password" required>
        </div>

        <div class="form-group">
            <label>Gender</label>

            <div class="gender">
                <label><input type="radio" name="gen" value="Male" required> Male</label>

                <label><input type="radio" name="gen" value="Female"> Female</label>
            </div>
        </div>

        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel"
                   id="txtnum"
                   maxlength="10"
                   pattern="[0-9]{10}"
                   placeholder="Enter 10-digit Mobile Number"
                   required>
        </div>

        <div class="form-group">
            <label>Select Role</label>
            <select name="role" required>
                <option value="">--Select Role--</option>
                <option>Student</option>
                <option>Faculty</option>
                <option>Administrator</option>
            </select>
        </div>

        <div class="form-group">
            <label>Select Department</label>
            <select name="department" required>
                <option value="">--Select Department--</option>
                <option>Computer Engineering</option>
                <option>Information Technology</option>
                <option>Mechanical Engineering</option>
                <option>Civil Engineering</option>
                <option>Electrical Engineering</option>
                <option>Electronics & Communication</option>
            </select>
        </div>

        <div class="form-group">
            <input type="submit" value="Register" class="btn">
        </div>

    </form>

</div>

</body>
</html>
