<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
label{
    display: inline-block;
    width: 100px; /* Same width for all labels */
}
</style>

</head>
<body>

<header>
<h1>Student Registration</h1>
</header>

<main>
<form>
<label for="name">Name:</label>
<input type="text" required autofocus placeholder="Enter your name" id="name">
<br><br>

<label for="email">Email:</label>
<input type="email" required autofocus placeholder="Enter your email id" id="email">
<br><br>

<label for="password">Password:</label>
<input type="password" required autofocus placeholder="Enter your password" id="password">
<br><br>
<label for="submit">Click Here:</label>
<button type="submit">Register</button>
</form>
</main>

<footer>
<p>StudentHub</p>
</footer>

</body>
</html>
