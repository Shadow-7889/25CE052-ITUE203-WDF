<h2>Feedback Form</h2>

<form>

<label>Full Name:</label><br>
<input type="text" autofocus required placeholder="Enter username" name="fullname"><br><br>

<label>Email:</label><br>
<input type="email"autofocus required placeholder="Enter email"  name="email"><br><br>

<label>Department:</label><br>
<select name="department">
    <option>Computer Science</option>
    <option>Information Technology</option>
    <option>Electronics</option>
    <option>Mechanical</option>
    <option>Civil</option>
</select>

<br><br>

<label>Feedback:</label><br>
<textarea name="feedback" placeholder="Enter your feedback here.." rows="6" cols="50"></textarea>

<br><br>

<input type="submit" value="Submit">
<input type="reset" value="Clear">

</form>
